services:
  # ─── 1. Backend API (NestJS + WebSockets + Scheduled AI Matching) ─────────
  - type: web
    name: lnf-api
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build --workspace=@findit/shared-types && npm run build --workspace=@findit/api
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set to your Supabase PostgreSQL connection string
      - key: FRONTEND_URL
        fromService:
          type: web
          name: lnf-web
          property: url
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        fromService:
          type: web
          name: lnf-api
          property: url
          postfix: /api/auth/google/callback

  # ─── 2. Frontend Web Application (Next.js 16) ───────────────────────────
  - type: web
    name: lnf-web
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build --workspace=@findit/shared-types && npm run build --workspace=@findit/web
    startCommand: npm run start --workspace=@findit/web
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: lnf-api
          property: url
      - key: NEXT_PUBLIC_WS_URL
        fromService:
          type: web
          name: lnf-api
          property: url
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_MAPS_KEY
        sync: false
      - key: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
        value: 6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI
